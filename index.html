<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Petty Cash Manager</title>
<meta name="description" content="Offline-first petty cash management — ledger, reconciliation, and Excel import/export, all stored locally on your device." />
<meta name="theme-color" content="#4f46e5" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/icon-192.svg" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.10/tailwind.min.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] },
        borderRadius: { '3xl': '1.5rem' }
      }
    }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.6/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

<style>
  html, body { height: 100%; }
  body { -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 999px; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  #toast-host { position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%); z-index: 60; width: max-content; max-width: 92vw; }
  @media (min-width: 768px) { #toast-host { bottom: 24px; left: auto; right: 24px; transform: none; } }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900">
  <div id="app"></div>
  <div id="toast-host"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
